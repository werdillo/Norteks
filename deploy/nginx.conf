# Norteks on a VDS, optional tuning only.
#
# The site works on a stock nginx with nothing but `root` and `index index.html`:
# every page is a file at dist/<path>/index.html, and nginx's own rules serve it and
# redirect /about-us to /about-us/. This file adds what a stock setup lacks:
# compression and cache headers. Nothing in it is needed for the pages to work.
#
# Deploy: bun run build, then copy dist/ to the server (rsync -a --delete dist/ /var/www/norteks/dist/).
# Nothing else: no rewrites, no proxy, no reload is needed unless you change this file.

server {
    listen 80;
    listen [::]:80;
    server_name tkani-nortex.ru www.tkani-nortex.ru;

    root /var/www/norteks/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml text/plain;
    # Brotli needs the ngx_brotli module; when it is installed, enable it here too:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml;

    # Bundles are named by their content hash: cache them for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pages, paths.json and the sitemaps revalidate on each visit.
    location / {
        add_header Cache-Control "no-cache";
    }

    # Optional, only if PocketBase runs on this VDS and should be reached through the site
    # (no CORS): set PUBLIC_POCKETBASE_URL=https://tkani-nortex.ru before the build, and uncomment.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
