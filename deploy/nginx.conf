# Norteks on the VDS: the static build (dist/) served by nginx.
# Deploy: bun run build, copy dist/ to /var/www/norteks/dist, then nginx -t && nginx -s reload.

server {
    listen 80;
    listen [::]:80;
    server_name tkani-nortex.ru www.tkani-nortex.ru;

    root /var/www/norteks/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml text/plain;
    # Brotli needs the ngx_brotli module; when it is installed, enable it here too:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json application/ld+json application/xml image/svg+xml;

    # One address per page: no trailing slash (the site is built with trailingSlash "never").
    rewrite ^/(.*[^/])/$ /$1 permanent;

    # The sitemap was /sitemap.xml; the integration writes /sitemap-index.xml.
    location = /sitemap.xml {
        try_files /sitemap-index.xml =404;
    }

    # Data pages are one shell each: the browser reads the address and loads the record.
    # The URL stays as it is; only the file served changes.
    rewrite ^/textile/[^/]+/[^/]+$ /shell/textile-collection/index.html last;
    rewrite ^/textile/[^/]+$ /shell/textile-type/index.html last;
    rewrite ^/post/[^/]+$ /shell/post/index.html last;

    # The shells are not pages of their own: a direct request to /shell/... is a 404.
    # `rewrite ... last` runs the location search again, and `internal` allows it there.
    location ^~ /shell/ {
        internal;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Bundles are named by their content hash: cache them for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages and everything else revalidate on each visit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    # Optional: PocketBase on this VDS, reached through the site, which avoids CORS.
    # Then set PUBLIC_POCKETBASE_URL=https://tkani-nortex.ru before the build.
    # location /api/ {
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
